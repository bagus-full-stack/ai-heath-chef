name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version fixée : `stable` seul a avancé et signale des API dépréciées (material_ui) que le code n'a pas encore migrées.
          flutter-version: 3.47.7
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Création du .env (asset requis, non commité)
        run: cp .env.example .env

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  deno:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests des Edge Functions
        run: |
          deno test --allow-env supabase/functions/_shared_hc/
          deno test --allow-env --allow-read supabase/functions/hc-delete-account/
          deno test --allow-env supabase/functions/hc-coach-chat/
          deno test --allow-env supabase/functions/hc-meal-images/
          deno test --allow-env supabase/functions/hc-huggingface-token/
