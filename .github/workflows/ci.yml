name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Création du .env (asset requis, non commité)
        run: cp .env.example .env

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Le web est une cible : analyze et test ne détectent pas une erreur de compilation web.
      - name: Build web
        run: flutter build web

  deno:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests des Edge Functions
        run: |
          deno test --allow-env supabase/functions/_shared/
          deno test --allow-env --allow-read supabase/functions/delete-account/
          deno test --allow-env supabase/functions/coach-chat/
